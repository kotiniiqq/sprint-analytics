[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sprint-analytics"
version = "0.1.0"
description = "Jira sprint metrics computed by code, reported by an LLM, guarded against invented numbers. MCP server, evals and tracing included."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Kyrylo Kalashnyk" }]
dependencies = ["httpx>=0.27", "mcp>=2.3,<3", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sprint-analytics = "sprint_analytics.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sprint_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
